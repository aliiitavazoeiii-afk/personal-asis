name: Test Personal Assist Server and PWA

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'tests/**'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install -r server/requirements.txt pytest
      - name: Check JavaScript syntax
        run: node --check server/static/assets/app.js
      - name: Run FastAPI and PWA tests
        run: python -m pytest tests -q
