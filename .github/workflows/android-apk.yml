name: Build Personal Assist APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/private.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/private.jks" >> "$GITHUB_ENV"
          fi
      - name: Build installable APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            gradle -p android assembleRelease --no-daemon
          else
            gradle -p android assembleDebug --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalAssist-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download prerelease for phone testing
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" PersonalAssist-Android-Test.apk
          gh release create "android-test-${{ github.run_number }}"             PersonalAssist-Android-Test.apk             --repo "${{ github.repository }}"             --title "Personal Assist Android Test #${{ github.run_number }}"             --notes "Android test APK. This build may be debug-signed. Install manually for testing only. If Android reports a signing mismatch, uninstall the previous debug version and install this file. Personal data is stored on your own server."             --prerelease
